[package]
name = "fitsense"
version = "0.2.0"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.22"
chacha20poly1305 = "0.10.1"
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }
rusqlite = { version = "0.43", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tempfile = "3"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
debug = 0
